<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lotus</title>
<meta name="description" content="ניהול תזרים חודשי: כמה נשאר להוציא עד סוף החודש.">
<meta name="theme-color" content="#F1F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1816" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one calm column, like a pond seen from above. The deep-green hero holds the single number that matters; everything below explains it. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --sunken:#E6ECE9; --line:#D5DEDA;
  --ink:#12302B; --muted:#5B706B;
  --pond:#12423A; --on-pond:#F1F7F4; --on-pond-muted:#A9C7BE; --pond-line:#2A5C52;
  --petal:#F58DB4; --petal-off:#3A6A60;
  --accent:#BF2F6C; --on-accent:#FFFFFF; --accent-soft:#FBE7EF;
  --good:#1B7A5A; --warn:#A8690A; --bad:#BF3A2E;
  --c1:#1B7A5A; --c2:#BF2F6C; --c3:#2F6DB5; --c4:#A8690A; --c5:#7A4FB8; --c6:#0E8490; --c7:#B5502A; --c8:#5B706B;
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"Heebo","Segoe UI",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1816; --surface:#12231F; --sunken:#182E29; --line:#24403A;
  --ink:#E4EFEA; --muted:#93ABA4;
  --pond:#173B34; --on-pond:#F1F7F4; --on-pond-muted:#A0BFB6; --pond-line:#2C5A50;
  --petal:#F58DB4; --petal-off:#33584F;
  --accent:#F27DAB; --on-accent:#2B0A19; --accent-soft:#3A1B29;
  --good:#52C99C; --warn:#E3A848; --bad:#F0796C;
  --c1:#52C99C; --c2:#F27DAB; --c3:#7FB2EE; --c4:#E3A848; --c5:#B79BEA; --c6:#5CCAD4; --c7:#EE9670; --c8:#93ABA4;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1816; --surface:#12231F; --sunken:#182E29; --line:#24403A;
  --ink:#E4EFEA; --muted:#93ABA4;
  --pond:#173B34; --on-pond:#F1F7F4; --on-pond-muted:#A0BFB6; --pond-line:#2C5A50;
  --petal:#F58DB4; --petal-off:#33584F;
  --accent:#F27DAB; --on-accent:#2B0A19; --accent-soft:#3A1B29;
  --good:#52C99C; --warn:#E3A848; --bad:#F0796C;
  --c1:#52C99C; --c2:#F27DAB; --c3:#7FB2EE; --c4:#E3A848; --c5:#B79BEA; --c6:#5CCAD4; --c7:#EE9670; --c8:#93ABA4;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;direction:ltr}
.brand svg{width:28px;height:28px}
.month{margin-inline-start:auto;display:flex;align-items:center;gap:2px}
.month b{min-width:7.2em;text-align:center;font-weight:500}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.icon-btn:hover{background:var(--sunken)}
.icon-btn svg{width:18px;height:18px}
.add-top{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 12px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column;gap:20px;padding-block:20px 112px}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:.92rem}
.note p{margin:0;flex:1 1 220px;min-width:0}
.note.quiet{background:var(--sunken);color:var(--muted)}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.btn.small{padding:6px 14px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}

.hero{background:var(--pond);color:var(--on-pond);border-radius:24px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.hero .lbl{color:var(--on-pond-muted);font-size:.95rem}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11vw,4rem);line-height:1.05;margin-block:4px}
.hero .sub{color:var(--on-pond-muted)}
.hero .flower{width:clamp(112px,30vw,190px);height:auto}
.hero .foot{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.meter{height:8px;border-radius:99px;background:var(--pond-line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--petal)}
.hero .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--on-pond-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:500;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.hero .chip{background:var(--pond-line);color:var(--on-pond)}
.hero-empty{grid-column:1/-1;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hero-empty h2{font-family:var(--display);font-size:1.6rem;margin:0;text-wrap:balance}

section>h2,.sec-h h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.panel{background:var(--surface);border-radius:var(--r);padding:4px 16px}
.ledger{margin:0;padding:0;list-style:none}
.ledger li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ledger li:last-child{border-bottom:0;font-weight:700}
.ledger .k{color:var(--muted)} .ledger li:last-child .k{color:var(--ink)}
.ledger.plain li:last-child{font-weight:400}.ledger.plain li:last-child .k{color:var(--muted)}

.weeks{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);min-width:0}
.wk-track{position:relative;width:100%;max-width:56px;height:120px;background:var(--sunken);border-radius:10px;overflow:hidden;display:flex;align-items:flex-end}
.wk-bar{width:100%;background:var(--good);border-radius:10px 10px 0 0}
.wk.over .wk-bar{background:var(--bad)}
.wk-mark{position:absolute;inset-inline:0;border-top:2px dashed var(--ink);opacity:.55}
.wk.now .wk-l{color:var(--ink);font-weight:700}
.wk-l{text-align:center}
.wk-v{color:var(--ink);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;border-top:2px dashed var(--ink);opacity:.55;vertical-align:middle;margin-inline-end:6px}

.list{margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
.list li:last-child .item{border-bottom:0}
.item:hover .t1{color:var(--accent)}
.dot{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--cc)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{font-weight:500;overflow-wrap:anywhere}
.t2{font-size:.85rem;color:var(--muted)}
.amt{font-weight:500;white-space:nowrap}
.amt.in{color:var(--good)}
.day-h{font-size:.85rem;color:var(--muted);margin:16px 0 6px}
.day-h:first-child{margin-top:0}

.tools{display:flex;flex-direction:column;gap:10px}
.tools-row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.tools-row .links{display:flex;gap:16px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.9rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.cat{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
.list li:last-child .cat{border-bottom:0}
.cat-top{display:flex;align-items:center;gap:12px}
.track{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--cc)}
.track.over i{background:var(--bad)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 25%,transparent);padding:14px 22px;font-size:1rem}
.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;display:flex;gap:16px;align-items:center;font-size:.92rem}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:92%;margin:auto auto 0;border-radius:24px 24px 0 0;direction:rtl}
dialog::backdrop{background:rgba(6,20,17,.55)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
dialog h3{font-family:var(--display);font-size:1.35rem;margin:0}
dialog p{margin:0}
dialog label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
dialog .field{background:var(--bg);color:var(--ink);font-size:1rem}
.amount-in{font-family:var(--display);font-size:2rem;font-weight:700;text-align:center;direction:ltr}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:12px;padding:3px}
.seg label{display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px;border-radius:10px;color:var(--muted);font-size:.95rem;font-weight:500;cursor:pointer}
.seg input:checked+span{background:var(--surface);color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
dialog .acts .btn:first-child{flex:1}
.err{color:var(--bad);font-size:.88rem}
.hint{color:var(--muted);font-size:.9rem}
.imp-list{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.imp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.imp-row:last-child{border-bottom:0}
.imp-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.imp-row select{grid-column:2/-1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:.88rem;max-width:100%}
.imp-row.off{opacity:.55}

.gated .top,.gated .fab{display:none}
.gate{background:var(--pond);color:var(--on-pond);border-radius:24px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-top:6vh}
.gate h1{font-family:var(--display);font-size:2.4rem;line-height:1;margin:0;direction:ltr}
.gate p{margin:0;max-width:34ch;text-wrap:balance}
.gate .sub{color:var(--on-pond-muted)}
.gate .fine{color:var(--on-pond-muted);font-size:.82rem;max-width:42ch}
.gate .flower{width:150px;height:auto}
.gate .btn{background:var(--on-pond);color:var(--pond);padding:12px 26px;font-size:1rem}
.gate .link{color:var(--on-pond);text-decoration:underline;font-size:.9rem}
.gate .gerr{color:var(--petal);font-size:.9rem}
.acct{padding-block:14px}
.acct p{margin:0 0 12px}
.acct .acts{margin:0}
.acct .acts .btn{flex:none}
.acct .link.danger{color:var(--bad);margin-top:14px;font-size:.9rem}
@media (min-width:700px){
  .add-top{display:inline-block}
  .fab{display:none}
  main{padding-bottom:48px}
  .toast{bottom:24px}
  dialog{margin:auto;border-radius:24px}
  .hero{padding:32px}
}
@media (prefers-reduced-motion:no-preference){
  .meter i,.wk-bar,.track i{transition:width .4s ease,height .4s ease}
}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand" aria-label="Lotus">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="var(--accent)"><path d="M16 26C9 22 9 12 16 4c7 8 7 18 0 22Z"/><path d="M15 27C8 27 3 22 2 14c6 1 11 5 13 13Z" opacity=".6"/><path d="M17 27c7 0 12-5 13-13-6 1-11 5-13 13Z" opacity=".6"/></g></svg>

        <button class="icon-btn" data-act="prev" aria-label="החודש הקודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        <b id="monthName"></b>

      </div>

<script>
(function(){
"use strict";
document.documentElement.lang="he"; document.documentElement.dir="rtl";
const SA=!!window.LOTUS_STANDALONE;
const FB=SA&&window.firebase&&window.LOTUS_FIREBASE?window.firebase:null;
let AUTH=null, USER=null, enterSeq=0;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const curKey=now.getFullYear()+"-"+pad(now.getMonth()+1);
const todayStr=curKey+"-"+pad(now.getDate());
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const r2=v=>Math.round(v*100)/100;
function money(n,plus){
  const neg=n<0, v=r2(Math.abs(n));
  const s=v.toLocaleString("he-IL",{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2});
  return '<span class="num">'+(neg&&v?"−":plus&&v?"+":"")+"₪"+s+"</span>";
}
const parseAmt=s=>{const v=parseFloat(String(s).replace(/[,\s₪]/g,""));return isFinite(v)&&v>0?r2(v):null};
function shiftMonth(k,d){let[y,m]=k.split("-").map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)}
const dim=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const monthLabel=k=>{const[y,m]=k.split("-").map(Number);return new Intl.DateTimeFormat("he-IL",{month:"long",year:"numeric"}).format(new Date(y,m-1,1))};
function dayLabel(ds){
  const[y,m,d]=ds.split("-").map(Number), dt=new Date(y,m-1,d);
  const yd=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  if(ds===todayStr)return"היום";
  if(dt.getTime()===yd.getTime())return"אתמול";
  return new Intl.DateTimeFormat("he-IL",{weekday:"long",day:"numeric",month:"long"}).format(dt);
}
const nTx=n=>n===1?"תנועה אחת":n+" תנועות";
const shortDate=ds=>ds.slice(8)+"/"+ds.slice(5,7)+"/"+ds.slice(0,4);

/* ---------- data ---------- */
const DEFAULT_CATS=[
  {id:"super",name:"סופר",budget:2400,c:1},{id:"rest",name:"מסעדות וקפה",budget:800,c:2},
  {id:"trans",name:"תחבורה ודלק",budget:700,c:3},{id:"shop",name:"קניות",budget:600,c:4},
  {id:"fun",name:"פנאי ובילויים",budget:500,c:5},{id:"health",name:"בריאות ופארם",budget:300,c:6},
  {id:"home",name:"בית",budget:400,c:7},{id:"other",name:"אחר",budget:300,c:8}];
const emptySettings=()=>({v:1,incomes:[],fixed:[],saving:0,cats:clone(DEFAULT_CATS)});

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
async function connect(){
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const[db,user,dl]=await Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("downloads")]);
      S.dl=dl||null;
      const id=user?await user.id():null;
      if(db&&id){
        const col=db.collection("data/users/"+id);
        return{kind:"db",async get(k){const s=await col.doc(k).get();return s.exists?clone(s.data()):null},set:(k,d)=>col.doc(k).set(d)};
      }
    }
  }catch(e){}
  if(SA)S.dl={save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data]));const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);return{status:"saved"}}};
  if(SA&&FB&&USER)return fbBackend(USER.uid);
  return localBackend();
}
function localBackend(){
  return{kind:"local",get:async k=>ls.get(k),set:async(k,d)=>{localStorage.setItem("lotus:"+k,JSON.stringify(d))},
    async all(){const o={};lotusKeys().forEach(k=>o[k.slice(6)]=ls.get(k.slice(6)));return o},
    async replaceAll(data){lotusKeys().forEach(k=>localStorage.removeItem(k));Object.keys(data).forEach(k=>localStorage.setItem("lotus:"+k,JSON.stringify(data[k])))}};
}
/* Cloud storage for the installed app: one private set of documents per signed-in Google account. */
function fbBackend(uid){
  const fs=FB.firestore(), col=fs.collection("users").doc(uid).collection("docs");
  const onErr=e=>{if(!USER||USER.uid!==uid)return;if(e&&e.code==="permission-denied")S.perm=true;S.saveFailed=true;softRender()};
  return{kind:"db",uid,
    async get(k){
      let s;
      try{s=await withTimeout(col.doc(k).get(),7000)}
      catch(e){if(e&&e.code==="permission-denied")throw e;s=await col.doc(k).get({source:"cache"})}
      return s.exists?clone(s.data()):null;
    },
    /* The local write lands at once and is queued for the server, so saving works offline; a server refusal arrives later through onErr. */
    set(k,d){col.doc(k).set(d).catch(onErr);return Promise.resolve()},
    async all(){const q=await withTimeout(col.get({source:"server"}),12000);const o={};q.forEach(d=>{o[d.id]=clone(d.data())});return o},
    async replaceAll(data){
      const q=await withTimeout(col.get({source:"server"}),12000), b=fs.batch();
      q.forEach(d=>{if(!(d.id in data))b.delete(d.ref)});
      Object.keys(data).forEach(k=>b.set(col.doc(k),data[k]));
      await withTimeout(b.commit(),15000);
    }};
}
const pending={},writing={};
const busyWriting=()=>Object.keys(writing).some(k=>writing[k]||pending[k]);
const owner=()=>USER?USER.uid:"local";
function writeCache(){ls.set("cache",{settings:S.settings,month:S.months[curKey]||{tx:[]},mk:curKey,owner:owner()})}
function save(key){
  if(S.demo||!backend||S.loadFailed)return;
  if(key===("m-"+curKey)||key==="settings")writeCache();
  pending[key]=true; if(!writing[key])flush(key);
}
async function flush(key){
  writing[key]=true;
  let tries=0;
  while(pending[key]){
    pending[key]=false;
    const data=key==="settings"?S.settings:(S.months[key.slice(2)]||{tx:[]});
    try{await backend.set(key,clone(data));tries=0;if(S.saveFailed&&!Object.keys(pending).some(k=>pending[k])){S.saveFailed=false;softRender()}}
    catch(e){
      if(tries++<1){pending[key]=true;await new Promise(r=>setTimeout(r,1500));continue}
      S.saveFailed=true;softRender();break;
    }
  }
  writing[key]=false;
}
const recNow=()=>({incomes:clone(S.settings.incomes),fixed:clone(S.settings.fixed),saving:+S.settings.saving||0});

function signIn(){
  if(!AUTH||S.gateBusy)return;
  S.gateErr="";S.gateBusy=true;if(S.gate)render();
  const p=new FB.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  AUTH.signInWithPopup(p).catch(e=>{
    const c=(e&&e.code)||"";
    if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")return AUTH.signInWithRedirect(p);
    throw e;
  }).catch(e=>{
    const c=(e&&e.code)||"";
    const msg=c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"||c==="auth/user-cancelled"?"":
      c==="auth/unauthorized-domain"?"הכתובת הזו עוד לא מורשית בפרויקט Firebase (Authorized domains).":
      c==="auth/operation-not-allowed"?"כניסה עם Google עוד לא הופעלה בפרויקט Firebase.":
      c==="auth/network-request-failed"?"אין חיבור לאינטרנט. הכניסה דורשת חיבור.":
      "הכניסה נכשלה. אפשר לנסות שוב."+(c?" ("+c+")":"");
    S.gateErr=msg;S.gateBusy=false;
    if(S.gate)render();else if(msg)toast(msg);
  });
}

async function loadAll(){
  if(!backend)return;
  S.checking=true;S.loadFailed=false;S.perm=false;render();
  try{
    let st=await withTimeout(backend.get("settings"),10000);
    if(!st&&!SA&&backend.kind==="db"){
      const loc=ls.get("settings");
      if(loc&&Array.isArray(loc.cats)){
        await withTimeout(backend.set("settings",loc),10000);
        let keys=[];try{keys=Object.keys(localStorage).filter(k=>/^lotus:m-\d{4}-\d{2}$/.test(k))}catch(e){}
        for(const k of keys){const m=ls.get(k.slice(6));if(m&&Array.isArray(m.tx))await withTimeout(backend.set(k.slice(6),m),10000)}
        st=loc;
      }
    }
    if(st&&Array.isArray(st.cats)){
      const m=await withTimeout(backend.get("m-"+curKey),10000);
      S.settings=Object.assign(emptySettings(),st);S.months={[curKey]:normMonth(m)};S.demo=false;
      S.checking=false;

async function ensureMonth(mk){

  try{S.months[mk]=normMonth(await withTimeout(backend.get("m-"+mk),10000));if(S.failedMonth===mk)S.failedMonth=""}
  catch(e){ok=false;S.failedMonth=mk}
  S.loadingMonth=false;softRender();
  return ok;
}
/* Another device may have written since this tab last looked: re-read when the tab comes back. */
async function resync(){
  if(S.demo||!backend||backend.kind!=="db"||S.checking||S.loadFailed||busyWriting()||sheet.open)return;
  if(Date.now()-lastSync<20000)return;
  lastSync=Date.now();
  try{
    const keys=[curKey].concat(S.mk!==curKey?[S.mk]:[]);
    const[st,...ms]=await Promise.all([withTimeout(backend.get("settings"),10000)].concat(keys.map(k=>withTimeout(backend.get("m-"+k),10000))));
    if(busyWriting()||sheet.open||!st||!Array.isArray(st.cats))return;
    const before=JSON.stringify([S.settings,keys.map(k=>S.months[k])]);
    S.settings=Object.assign(emptySettings(),st);
    const kept={};keys.forEach((k,i)=>kept[k]=normMonth(ms[i]));S.months=kept;
    if(JSON.stringify([S.settings,keys.map(k=>S.months[k])])!==before){writeCache();softRender()}
  }catch(e){}
}

/* ---------- calculations ---------- */
const txOf=mk=>(S.months[mk]||{tx:[]}).tx;
const catOf=id=>S.settings.cats.find(c=>c.id===id)||{id:"",name:"ללא קטגוריה",budget:0,c:8};
function calc(mk){
  const tx=txOf(mk), m=S.months[mk];
  const st=(mk<curKey&&m&&m.rec)?m.rec:S.settings;
  const baseInc=sum(st.incomes,x=>x.amount), extraInc=sum(tx.filter(t=>t.type==="inc"),t=>t.amount);
  const income=baseInc+extraInc, fixed=sum(st.fixed,x=>x.amount), saving=+st.saving||0;
  const budget=income-fixed-saving, spent=sum(tx.filter(t=>t.type!=="inc"),t=>t.amount);
  const days=dim(mk), rel=mk<curKey?-1:mk>curKey?1:0, day=rel===0?now.getDate():rel<0?days:0;
  const daysLeft=rel===0?days-day+1:rel>0?days:0;
  return{income,baseInc,extraInc,fixed,saving,budget,spent,left:budget-spent,days,rel,day,daysLeft};
}
function guessCat(desc,strict){
  const d=String(desc||"").trim().toLowerCase(), has=id=>S.settings.cats.some(c=>c.id===id);
  if(d){
    for(const k of Object.keys(S.months).sort().reverse()){const a=S.months[k].tx;for(let i=a.length-1;i>=0;i--)if(a[i].type!=="inc"&&(a[i].desc||"").trim().toLowerCase()===d&&has(a[i].cat))return a[i].cat}
    for(const[re,id]of KEYWORDS)if(re.test(d)&&has(id))return id;
  }
  if(strict)return null;
  return has("other")?"other":(S.settings.cats[0]?S.settings.cats[0].id:"");
}

  return'<svg class="flower" viewBox="22 14 156 104" role="img" aria-label="פרח לוטוס: '+k+' מתוך 7 עלי כותרת מלאים">'+
    petals.map(p=>'<path transform="translate(100 96) rotate('+p[0]+')" d="M0 0C-17-24-12-58 0-74 12-58 17-24 0 0Z" fill="'+(p[1]<=k?"var(--petal)":"var(--pond)")+'" stroke="'+(p[1]<=k?"var(--pond)":"var(--petal-off)")+'" stroke-width="1.5"/>').join("")+
    '<path d="M30 104h140M56 112h88" fill="none" stroke="var(--petal-off)" stroke-width="2" stroke-linecap="round"/></svg>';
}

function hero(c){

const cleanCell=c=>typeof c==="string"?c.replace(/[‎‏‪-‮﻿]/g,"").replace(/\s+/g," ").trim():c;
function parseDate(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400e3));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
  if(typeof v!=="string")return null;
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  let y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}
  else{m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})(?!\d)/);if(!m)return null;d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
  if(mo<1||mo>12||d<1||d>31||y<2000||y>2100)return null;
  return y+"-"+pad(mo)+"-"+pad(d);
}
function parseNum(v){
  if(typeof v==="number")return isFinite(v)?v:null;
  if(typeof v!=="string"||!v)return null;
  let s=v.replace(/[₪\s]|ש"ח|ש״ח|ils|nis/gi,"");
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/-$/.test(s)){neg=!neg;s=s.slice(0,-1)}
  if(/^[-−–]/.test(s)){neg=!neg;s=s.slice(1)}
  s=s.replace(/^\+/,"").replace(/,(?=\d{3}(\D|$))/g,"");
  if(!/^\d+([.,]\d+)?$/.test(s))return null;
  const n=parseFloat(s.replace(",","."));
  return isFinite(n)?(neg?-n:n):null;
}
function headerMap(cells){
  const find=(...res)=>{for(const re of res){const i=cells.findIndex(c=>typeof c==="string"&&c.length<40&&re.test(c));if(i>-1)return i}return null};
  const date=find(/תאריך ה?עסקה|תאריך ה?רכישה|תאריך ה?פעולה/,/תאריך|date/i);
  if(date==null||parseDate(cells[date]))return null;
  let debit=find(/חובה|debit/i), credit=find(/זכות|credit/i);
  let amount=find(/סכום ה?חיוב|סכום לחיוב|חיוב בש/,/סכום|amount|^חיוב/i);
  if(amount===date)amount=null;
  if(debit!=null&&credit==null&&amount==null){amount=debit;debit=null}
  if(credit!=null&&debit==null){if(amount==null)amount=credit;credit=null}
  if(amount==null&&debit==null)return null;
  const desc=find(/שם בית|בית ה?עסק/,/תיאור|פרטים|פעולה|description|merchant|details|שם/i);
  return{date,amount,debit,credit,desc:desc===date?null:desc};
}
function pickDesc(cells,map){
  if(map.desc!=null&&typeof cells[map.desc]==="string"&&cells[map.desc])return cells[map.desc];
  let best="";
  cells.forEach((c,i)=>{if(i!==map.date&&typeof c==="string"&&c.length>best.length&&!parseDate(c)&&parseNum(c)==null)best=c});
  return best;
}
function guessMap(rows){
  const n=Math.max(0,...rows.map(r=>r.length)), st=[];
  for(let i=0;i<n;i++)st.push({d:0,n:0,dec:0,s:0});
  rows.forEach(r=>r.forEach((c,i)=>{if(c===""||c==null)return;if(parseDate(c)&&!(typeof c==="number"))st[i].d++;else if(parseNum(c)!=null){st[i].n++;if(!Number.isInteger(parseNum(c)))st[i].dec++}else if(typeof c==="string")st[i].s+=c.length}));
  let date=null,amount=null;
  st.forEach((x,i)=>{if(x.d&&(date==null||x.d>st[date].d))date=i});
  st.forEach((x,i)=>{if(i!==date&&x.n&&(amount==null||x.n+x.dec>st[amount].n+st[amount].dec))amount=i});
  if(date==null||amount==null||st[date].d<1)return null;
  return{date,amount,debit:null,credit:null,desc:null};
}
function extractRows(sheets){
  const out=[];
  sheets.forEach(raw=>{
    const rows=raw.map(r=>(Array.isArray(r)?r:[]).map(cleanCell));
    let map=null, signed=[], any=false;
    const take=(cells,m)=>{
      const date=parseDate(cells[m.date]);if(!date)return;
      const desc=pickDesc(cells,m);
      if(m.debit!=null){const d=parseNum(cells[m.debit]),c=m.credit!=null?parseNum(cells[m.credit]):null;
        if(d)out.push({date,amount:r2(Math.abs(d)),type:"exp",desc});else if(c)out.push({date,amount:r2(Math.abs(c)),type:"inc",desc})}
      else{const v=parseNum(cells[m.amount]);if(v)signed.push({date,v,desc})}
    };
    rows.forEach(cells=>{const hm=headerMap(cells);if(hm){map=hm;any=true;return}if(map)take(cells,map)});
    if(!any){const gm=guessMap(rows);if(gm)rows.forEach(c=>take(c,gm))}
    if(signed.length){
      const neg=signed.filter(x=>x.v<0).length, flip=neg>signed.length/2;
      signed.forEach(x=>{const v=flip?-x.v:x.v;
        if(v>0)out.push({date:x.date,amount:r2(v),type:"exp",desc:x.desc});
        else out.push({date:x.date,amount:r2(-v),type:"inc",desc:flip||/זיכוי|החזר/.test(x.desc)?x.desc:("זיכוי: "+x.desc).trim()})});
    }
  });
  return out;
}
function parseCSV(text){
  const head=text.split(/\r?\n/).slice(0,8).join("\n");
  const delim=["\t",";",",","|"].map(d=>[d,head.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"'&&cur==="")q=true;
    else if(ch===delim){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}
    else cur+=ch;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function decodeText(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder("utf-16le").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){try{return new TextDecoder("windows-1255").decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}
}
let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  if(!xlsxLoading)xlsxLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src=window.LOTUS_XLSX_SRC||"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res();s.onerror=()=>{xlsxLoading=null;rej(new Error("load"))};document.head.appendChild(s)});
  return xlsxLoading;
}
async function handleImportFile(file){

    else{
      try{await loadXLSX()}catch(e){return formErr("לא הצלחנו לטעון את רכיב קריאת ה-Excel. אפשר לנסות שוב, או לשמור את הקובץ כ-CSV ולייבא אותו.")}
      const wb=window.XLSX.read(buf,{type:"array",cellDates:true});

    }
  }catch(e){return formErr("לא הצלחנו לקרוא את הקובץ. כדאי לוודא שזה קובץ Excel או CSV תקין.")}

  });

}

  if(kind==="rec"){
    const name=String(fd.get("name")||"").trim(), amount=parseAmt(fd.get("amount")), day=Math.max(1,Math.min(31,parseInt(fd.get("day"),10)||1));
    if(!name)return formErr("צריך לתת שם.");
    if(!amount)return formErr("צריך להזין סכום גדול מאפס.");
    const arr=S.settings[f.dataset.kind], x={id:f.dataset.id||uid(),name,amount,day}, i=arr.findIndex(a=>a.id===x.id);
    if(i>-1)arr[i]=x;else arr.push(x);
  }
  if(kind==="cat"){
    const name=String(fd.get("name")||"").trim(), budget=parseAmt(fd.get("budget"))||0;
    if(!name)return formErr("צריך לתת שם לקטגוריה.");
    const c=S.settings.cats.find(a=>a.id===f.dataset.id);
    if(c){c.name=name;c.budget=budget}else S.settings.cats.push({id:uid(),name,budget,c:S.settings.cats.length%8+1});
  }
  if(kind==="saving")S.settings.saving=parseAmt(fd.get("amount"))||0;
  saveSettings();sheet.close();render();
});
function saveSettings(){save("settings");if(!S.demo&&stampRec())save("m-"+curKey)}

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null;
function toast(msg,undo){
  undoFn=undo||null;
  const el=$("#toast");el.innerHTML='<div role="status"><span>'+esc(msg)+"</span>"+(undo?'<button data-act="undo">ביטול המחיקה</button>':"")+"</div>";el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;undoFn=null},undo?7000:3200);
}

/* ---------- actions ---------- */
function findTx(id){for(const k in S.months){const t=S.months[k].tx.find(x=>x.id===id);if(t)return{t,k}}return null}
function canEdit(){
  if(S.checking){toast("רגע, טוען את הנתונים השמורים…");return false}
  if(S.loadFailed){toast("אין חיבור לנתונים השמורים. אפשר לנסות שוב בראש הדף.");return false}
  return true;
}
const EDITING={add:1,"edit-tx":1,"add-income":1,"add-fixed":1,"edit-rec":1,"add-cat":1,"edit-cat":1,"edit-saving":1,start:1,"import":1};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-view]");if(!b)return;
  if(b.dataset.view){S.view=b.dataset.view;render();window.scrollTo(0,0);return}
  const a=b.dataset.act,id=b.dataset.id;
  if(EDITING[a]&&!canEdit())return;
  if(a==="prev"||a==="next"){S.mk=shiftMonth(S.mk,a==="prev"?-1:1);render();ensureMonth(S.mk)}
  else if(a==="add")sheetTx(null);
  else if(a==="edit-tx"){const r=findTx(id);if(r)sheetTx(r.t)}
  else if(a==="del-tx"){const r=findTx(id);if(!r)return;const arr=S.months[r.k].tx,i=arr.indexOf(r.t);arr.splice(i,1);save("m-"+r.k);sheet.close();render();toast("התנועה נמחקה",()=>{const cur=S.months[r.k];if(!cur)return;cur.tx.splice(Math.min(i,cur.tx.length),0,r.t);save("m-"+r.k);render()})}
  else if(a==="add-income")sheetRec("incomes",null);
  else if(a==="add-fixed")sheetRec("fixed",null);
  else if(a==="edit-rec"){const x=S.settings[b.dataset.kind].find(q=>q.id===id);if(x)sheetRec(b.dataset.kind,x)}
  else if(a==="del-rec"){const kind=b.dataset.kind,arr=S.settings[kind],i=arr.findIndex(q=>q.id===id);if(i<0)return;const x=arr.splice(i,1)[0];saveSettings();sheet.close();render();toast("נמחק: "+x.name,()=>{const cur=S.settings[kind];cur.splice(Math.min(i,cur.length),0,x);saveSettings();render()})}
  else if(a==="add-cat")sheetCat(null);
  else if(a==="edit-cat"){const c=S.settings.cats.find(q=>q.id===id);if(c)sheetCat(c)}
  else if(a==="del-cat"){const arr=S.settings.cats,i=arr.findIndex(q=>q.id===id);if(i<0)return;const c=arr.splice(i,1)[0];if(S.fcat===c.id)S.fcat="";saveSettings();sheet.close();render();toast("הקטגוריה נמחקה. התנועות שלה נשארו ללא קטגוריה.",()=>{const cur=S.settings.cats;cur.splice(Math.min(i,cur.length),0,c);saveSettings();render()})}
  else if(a==="edit-saving")sheetSaving();
  else if(a==="fcat"){S.fcat=id||"";render()}
  else if(a==="import"){if(S.demo)return toast("כדי לייבא, קודם לוחצים על ״להתחיל עם הנתונים שלי״");sheetImport()}
  else if(a==="export")exportCsv();
  else if(a==="signin")signIn();
  else if(a==="local-mode"){ls.set("mode","local");enter(null)}
  else if(a==="signout"){if(AUTH)AUTH.signOut().catch(()=>toast("היציאה נכשלה. נסו שוב."))}
  else if(a==="migrate")migrateLocal();
  else if(a==="del-account")sheetDelAccount();
  else if(a==="retry-month")ensureMonth(S.mk);
  else if(a==="backup")backupNow();
  else if(a==="restore"){if(S.checking)return;sheetRestore()}
  else if(a==="imp-all"||a==="imp-none"){if(!IMP)return;const on=a==="imp-all";IMP.forEach(r=>r.on=on);sheet.querySelectorAll(".imp-row").forEach(row=>{row.classList.toggle("off",!on);row.querySelector("input[type=checkbox]").checked=on});syncImpCount()}
  else if(a==="close")sheet.close();
  else if(a==="undo"){if(undoFn)undoFn();undoFn=null;$("#toast").hidden=true}
  else if(a==="retry")loadAll();
  else if(a==="resave"){S.saveFailed=false;save("settings");Object.keys(S.months).forEach(k=>save("m-"+k));render()}
  else if(a==="start"){S.demo=false;S.settings=emptySettings();S.months={[curKey]:{tx:[]}};S.mk=curKey;S.view="home";stampRec();save("settings");save("m-"+curKey);render();sheetRec("incomes",null)}
});
document.addEventListener("input",e=>{
  if(e.target.id!=="search")return;
  S.q=e.target.value;
  const cur=$("#txlist");if(cur)cur.innerHTML=txListHtml();
});

boot();
})();
</script>

if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
</script>
