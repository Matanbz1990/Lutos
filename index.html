<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lotus</title>
<meta name="description" content="ניהול תזרים חודשי: כמה נשאר להוציא עד סוף החודש.">
<meta name="theme-color" content="#F1F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1816" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one calm column, like a pond seen from above. The deep-green hero holds the single number that matters; everything below explains it. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --sunken:#E6ECE9; --line:#D5DEDA;
  --ink:#12302B; --muted:#5B706B;
  --pond:#12423A; --on-pond:#F1F7F4; --on-pond-muted:#A9C7BE; --pond-line:#2A5C52;
  --petal:#F58DB4; --petal-off:#3A6A60;
  --accent:#BF2F6C; --on-accent:#FFFFFF; --accent-soft:#FBE7EF;
  --good:#1B7A5A; --warn:#A8690A; --bad:#BF3A2E;
  --c1:#1B7A5A; --c2:#BF2F6C; --c3:#2F6DB5; --c4:#A8690A; --c5:#7A4FB8; --c6:#0E8490; --c7:#B5502A; --c8:#5B706B;
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"Heebo","Segoe UI",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1816; --surface:#12231F; --sunken:#182E29; --line:#24403A;
  --ink:#E4EFEA; --muted:#93ABA4;
  --pond:#173B34; --on-pond:#F1F7F4; --on-pond-muted:#A0BFB6; --pond-line:#2C5A50;
  --petal:#F58DB4; --petal-off:#33584F;
  --accent:#F27DAB; --on-accent:#2B0A19; --accent-soft:#3A1B29;
  --good:#52C99C; --warn:#E3A848; --bad:#F0796C;
  --c1:#52C99C; --c2:#F27DAB; --c3:#7FB2EE; --c4:#E3A848; --c5:#B79BEA; --c6:#5CCAD4; --c7:#EE9670; --c8:#93ABA4;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1816; --surface:#12231F; --sunken:#182E29; --line:#24403A;
  --ink:#E4EFEA; --muted:#93ABA4;
  --pond:#173B34; --on-pond:#F1F7F4; --on-pond-muted:#A0BFB6; --pond-line:#2C5A50;
  --petal:#F58DB4; --petal-off:#33584F;
  --accent:#F27DAB; --on-accent:#2B0A19; --accent-soft:#3A1B29;
  --good:#52C99C; --warn:#E3A848; --bad:#F0796C;
  --c1:#52C99C; --c2:#F27DAB; --c3:#7FB2EE; --c4:#E3A848; --c5:#B79BEA; --c6:#5CCAD4; --c7:#EE9670; --c8:#93ABA4;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:8px;padding-block:12px 8px}
.icon-btn.acct-btn{flex:none;background:var(--pond);color:var(--on-pond);font-weight:700;font-size:.95rem;text-transform:uppercase}
.icon-btn.acct-btn:hover{background:var(--pond)}
@media (max-width:359px){.brand span{display:none}}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;direction:ltr}
.brand svg{width:28px;height:28px}
.month{margin-inline-start:auto;display:flex;align-items:center;gap:2px}
.month b{min-width:6.2em;text-align:center;font-weight:500}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.icon-btn:hover{background:var(--sunken)}
.icon-btn svg{width:18px;height:18px}
.cat-li .icon-btn svg{fill:none}
.add-top{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:8px 12px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column;gap:20px;padding-block:20px 108px}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:.92rem}
.note p{margin:0;flex:1 1 220px;min-width:0}
.note.quiet{background:var(--sunken);color:var(--muted)}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.btn.small{padding:6px 14px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}

.hero{background:var(--pond);color:var(--on-pond);border-radius:24px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.hero .lbl{color:var(--on-pond-muted);font-size:.95rem}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11vw,4rem);line-height:1.05;margin-block:4px}
.hero .sub{color:var(--on-pond-muted)}
.hero .flower{width:clamp(112px,30vw,190px);height:auto}
.hero .foot{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.meter{height:8px;border-radius:99px;background:var(--pond-line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--petal)}
.hero .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--on-pond-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:500;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.hero .chip{background:var(--pond-line);color:var(--on-pond)}
.hero-empty{grid-column:1/-1;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hero-empty h2{font-family:var(--display);font-size:1.6rem;margin:0;text-wrap:balance}

section>h2,.sec-h h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.panel{background:var(--surface);border-radius:var(--r);padding:4px 16px}
.ledger{margin:0;padding:0;list-style:none}
.ledger li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ledger li:last-child{border-bottom:0;font-weight:700}
.ledger .k{color:var(--muted)} .ledger li:last-child .k{color:var(--ink)}
.ledger.plain li:last-child{font-weight:400}.ledger.plain li:last-child .k{color:var(--muted)}

.weeks{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);min-width:0}
.wk-track{position:relative;width:100%;max-width:56px;height:120px;background:var(--sunken);border-radius:10px;overflow:hidden;display:flex;align-items:flex-end}
.wk-bar{width:100%;background:var(--good);border-radius:10px 10px 0 0}
.wk.over .wk-bar{background:var(--bad)}
.wk-mark{position:absolute;inset-inline:0;border-top:2px dashed var(--ink);opacity:.55}
.wk.now .wk-l{color:var(--ink);font-weight:700}
.wk-l{text-align:center}
.wk-v{color:var(--ink);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;border-top:2px dashed var(--ink);opacity:.55;vertical-align:middle;margin-inline-end:6px}

.list{margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
.list li:last-child .item{border-bottom:0}
.item:hover .t1{color:var(--accent)}
.dot{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--cc)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{font-weight:500;overflow-wrap:anywhere}
.t2{font-size:.85rem;color:var(--muted)}
.amt{font-weight:500;white-space:nowrap}
.amt.in{color:var(--good)}
.day-h{font-size:.85rem;color:var(--muted);margin:16px 0 6px}
.day-h:first-child{margin-top:0}

.tools{display:flex;flex-direction:column;gap:10px}
.tools-row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.tools-row .links{display:flex;gap:16px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.9rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.cat{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
.list li:last-child .cat{border-bottom:0}
.cat-top{display:flex;align-items:center;gap:12px}
.track{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--cc)}
.track.over i{background:var(--bad)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 25%,transparent);padding:14px 22px;font-size:1rem}
.toast{position:fixed;inset-inline:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;display:flex;gap:16px;align-items:center;font-size:.92rem}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:92%;margin:auto auto 0;border-radius:24px 24px 0 0;direction:rtl}
dialog::backdrop{background:rgba(6,20,17,.55)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
dialog h3{font-family:var(--display);font-size:1.35rem;margin:0}
dialog p{margin:0}
dialog label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
dialog .field{background:var(--bg);color:var(--ink);font-size:1rem}
.amount-in{font-family:var(--display);font-size:2rem;font-weight:700;text-align:center;direction:ltr}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:12px;padding:3px}
.seg label{display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px;border-radius:10px;color:var(--muted);font-size:.95rem;font-weight:500;cursor:pointer}
.seg input:checked+span{background:var(--surface);color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
dialog .acts .btn:first-child{flex:1}
.err{color:var(--bad);font-size:.88rem}
.hint{color:var(--muted);font-size:.9rem}
.imp-list{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.imp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.imp-row:last-child{border-bottom:0}
.imp-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.imp-row select{grid-column:2/-1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:.88rem;max-width:100%}
.imp-row.off{opacity:.55}

.guide{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;color:var(--muted);max-width:62ch}
.tip{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start}
.tip .ic{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--cc)}
.tip .ic svg{width:22px;height:22px}
.tip h3{margin:0;font-size:1.02rem;font-weight:700}
.tip p{margin:0;color:var(--muted);font-size:.95rem;max-width:62ch}
.tip .yours{grid-column:2;margin-top:6px;color:var(--ink);background:var(--sunken);border-radius:10px;padding:8px 12px;font-size:.92rem}
.article{background:var(--surface);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.article h3{margin:0;font-family:var(--display);font-size:1.15rem}
.article p{margin:0;max-width:62ch}
.article ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.article .term{font-weight:700}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.idx div{background:var(--sunken);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--muted)}
.idx b{display:block;color:var(--ink);direction:ltr;text-align:right}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.calc .field{background:var(--bg);direction:ltr;text-align:right}
.calc-out{background:var(--pond);color:var(--on-pond);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.calc-out .big{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1}
.calc-out .lbl{color:var(--on-pond-muted);font-size:.9rem}
.calc-out .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.92rem;color:var(--on-pond-muted)}
.calc-out .row b{color:var(--on-pond);font-weight:500}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--pond-line)}
.split i{display:block;height:100%}
.split .a{background:var(--on-pond-muted)} .split .b{background:var(--petal)}
.fineprint{font-size:.85rem;color:var(--muted);max-width:62ch;margin:0}
.bnav{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:.72rem;font-weight:500;border-radius:12px;min-width:0}
.bnav svg{width:22px;height:22px}
.bnav button[aria-current="page"]{color:var(--accent)}
.bnav .bnav-add{justify-self:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);margin-top:-24px}
.bnav .bnav-add svg{width:26px;height:26px;stroke-width:2.4}
.nomonth .month{visibility:hidden}
.greet h1{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.2}
.greet span{color:var(--muted);font-size:.9rem}
.hero .today{display:inline-flex;margin-top:10px;background:var(--pond-line);color:var(--on-pond);border-radius:99px;padding:4px 12px;font-size:.9rem;font-weight:500}
.inslist{margin:0;padding:0;list-style:none}
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0}
.ins .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--cc)}
.ins .ic svg{width:18px;height:18px}
.ins p{margin:0;font-size:.95rem}
.ins-acts{grid-column:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.setup{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--muted);min-height:34px}
.steps li.next{color:var(--ink);font-weight:500}
.steps .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.steps li.next .ck{border-color:var(--accent)}
.steps li.done .ck{background:var(--good);border-color:var(--good);color:var(--surface)}
.steps .ck svg{width:14px;height:14px;stroke-width:3}
.steps .btn{margin-inline-start:auto}
.setup>.link{align-self:flex-start;font-size:.85rem;color:var(--muted)}
.goal{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.goal-top{display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:start;width:100%}
.ring{flex:none;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--cc) calc(var(--p)*1%),var(--sunken) 0);display:grid;place-items:center}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.goal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.goal-foot .t2{min-width:0}
.goal-foot .btn{flex:none}
.empty-card{background:var(--pond);color:var(--on-pond);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.empty-card h3{font-family:var(--display);font-size:1.4rem;margin:0}
.empty-card p{margin:0;color:var(--on-pond-muted);max-width:36ch}
.empty-card .flower{width:130px;height:auto}
.empty-card .btn{background:var(--on-pond);color:var(--pond);margin-top:6px}
.more-list{display:flex;flex-direction:column}

function viewInvest(){

  '<div class="article"><h3>מה זה מדד</h3><p>מדד הוא רשימה של ניירות ערך שנבחרים לפי כלל קבוע, למשל ״500 החברות הגדולות בארה״ב״. מי שמשקיע במדד קונה חלק קטן מכל החברות שבו בבת אחת, במקום להמר על חברה אחת.</p><div class="idx"><div><b>S&amp;P 500</b>500 החברות הגדולות בארה״ב</div><div><b>MSCI World</b>כ-1,300 חברות ממדינות מפותחות</div><div><b>ת״א 125</b>125 החברות הגדולות בבורסה בתל אביב</div><div><b>Nasdaq 100</b>100 חברות גדולות, בעיקר טכנולוגיה</div></div></div>'+
  '<div class="article"><h3>למה דווקא מדדים</h3><ul><li><span class="term">פיזור.</span> נפילה של חברה אחת כמעט לא מורגשת כשמחזיקים מאות חברות.</li><li><span class="term">עלות נמוכה.</span> אין מנהל שבוחר מניות, ולכן דמי הניהול נמוכים בהרבה מאלה של קרן מנוהלת.</li><li><span class="term">קשה לנצח אותם.</span> מחקרים חוזרים מראים שרוב הקרנות המנוהלות משיגות לאורך שנים תשואה נמוכה מהמדד שלהן, אחרי דמי ניהול.</li><li><span class="term">פשטות.</span> לא צריך לעקוב אחרי חדשות או דוחות כספיים.</li></ul></div>'+
  '<div class="article"><h3>איך משקיעים בפועל</h3><ul><li><span class="term">קרן מחקה.</span> קרן נאמנות שעוקבת אחרי מדד ונקנית פעם ביום דרך הבנק או בית ההשקעות.</li><li><span class="term">קרן סל (ETF).</span> עוקבת אחרי מדד ונסחרת בבורסה לאורך היום, כמו מניה.</li><li><span class="term">מסלול מחקה מדד.</span> בקרן השתלמות, בקופת גמל להשקעה ובפנסיה אפשר לרוב לבחור מסלול שעוקב אחרי מדד, בלי לפתוח חשבון מסחר.</li></ul><p>את הקרנות קונים דרך חשבון מסחר בבנק או בבית השקעות. ההבדל ביניהם הוא בעיקר בעמלות.</p></div>'+
  '<div class="article"><h3>מה לבדוק לפני שבוחרים קרן</h3><ul><li><span class="term">דמי ניהול.</span> ההפרש בין 0.1% ל-1% בשנה מצטבר לאורך עשרות שנים לסכום גדול. המחשבון למטה מראה כמה.</li><li><span class="term">עמלות החשבון.</span> עמלת קנייה ומכירה, דמי משמרת ועמלת המרת מטבע.</li><li><span class="term">איזה מדד.</span> מדד רחב ומוכר עדיף על מדד צר או אופנתי.</li><li><span class="term">חשיפה למטבע.</span> קרן על מדד בחו״ל חשופה בדרך כלל גם לשער הדולר, אלא אם היא מנטרלת מטבע.</li><li><span class="term">מס.</span> בישראל הרווח הריאלי ממכירת ניירות ערך חייב במס רווחי הון, 25% ברוב המקרים. כדאי לוודא את השיעור העדכני ואת הכללים לגבי דיבידנדים.</li></ul></div>'+
  '<div class="article"><h3>הסיכונים</h3><p>מדד מניות יכול לרדת בעשרות אחוזים. ה-S&amp;P 500 ירד בכ-37% בשנת 2008 ובכ-18% בשנת 2022. לאורך כמאה שנה התשואה הממוצעת שלו הייתה בסביבות 10% בשנה לפני אינפלציה, אבל תשואות העבר אינן מבטיחות את העתיד, ואף שנה בודדת לא נראית כמו הממוצע.</p><ul><li>משקיעים רק כסף שלא יהיה נחוץ בעשר השנים הקרובות לפחות.</li><li>הפקדה חודשית קבועה עדיפה על ניסיון לתזמן את השוק.</li><li>ההפסד הגדול ביותר נגרם בדרך כלל ממכירה בזמן ירידה, לא מהירידה עצמה.</li></ul></div>'+
  '<div class="article"><h3>מחשבון ריבית דריבית</h3><p>כמה מצטבר מהפקדה חודשית קבועה, ומה דמי הניהול עושים לתוצאה. התשואה היא הנחה שלך, לא תחזית.</p><div class="calc"><label>הפקדה חודשית (₪)<input class="field" id="inv-dep" inputmode="decimal" autocomplete="off" value="'+dep+'"></label><label>מספר שנים<input class="field" id="inv-years" inputmode="numeric" autocomplete="off" value="20"></label><label>תשואה שנתית משוערת (%)<input class="field" id="inv-rate" inputmode="decimal" autocomplete="off" value="6"></label><label>דמי ניהול שנתיים (%)<input class="field" id="inv-fee" inputmode="decimal" autocomplete="off" value="0.2"></label></div><div class="calc-out" id="inv-out" aria-live="polite"></div></div>'+

function futureValue(dep,years,ratePct){
  const n=Math.round(years*12), r=Math.pow(1+ratePct/100,1/12)-1;
  return Math.abs(r)<1e-9?dep*n:dep*(Math.pow(1+r,n)-1)/r;
}
function calcInvest(){
  const out=$("#inv-out");if(!out)return;
  const num=(id,max)=>{const v=parseFloat(String($(id).value).replace(/[,\s₪%]/g,""));return isFinite(v)&&v>=0?Math.min(v,max):NaN};
  const dep=num("#inv-dep",1e7), years=num("#inv-years",60), rate=num("#inv-rate",30), fee=num("#inv-fee",10);
  if([dep,years,rate,fee].some(isNaN)||!dep||!years){out.innerHTML='<span class="lbl">ממלאים הפקדה חודשית ומספר שנים כדי לראות את התוצאה.</span>';return}
  const paid=dep*Math.round(years*12), net=futureValue(dep,years,rate-fee), gross=futureValue(dep,years,rate), gain=Math.max(0,net-paid);
  const pa=net>0?Math.min(100,paid/net*100):100;
  out.innerHTML='<div><div class="lbl">הסכום שיצטבר אחרי '+(Math.round(years*10)/10)+' שנים</div><div class="big">'+money(Math.round(net))+'</div></div>'+
    '<div class="split" role="img" aria-label="חלוקה בין הפקדות לרווח"><i class="a" style="width:'+pa.toFixed(1)+'%"></i><i class="b" style="width:'+(100-pa).toFixed(1)+'%"></i></div>'+
    '<div class="row"><span>מתוכו הפקדות <b>'+money(paid)+'</b></span><span>רווח מצטבר <b>'+money(Math.round(gain))+'</b></span></div>'+
    (fee>0?'<div class="row"><span>דמי הניהול גרעו מהתוצאה <b>'+money(Math.round(gross-net))+'</b></span></div>':"");
}

const cleanCell=c=>typeof c==="string"?c.replace(/[‎‏‪-‮﻿]/g,"").replace(/\s+/g," ").trim():c;
function parseDate(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400e3));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
  if(typeof v!=="string")return null;
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  let y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}
  else{m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})(?!\d)/);if(!m)return null;d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
  if(mo<1||mo>12||d<1||d>31||y<2000||y>2100)return null;
  return y+"-"+pad(mo)+"-"+pad(d);
}
function parseNum(v){
  if(typeof v==="number")return isFinite(v)?v:null;
  if(typeof v!=="string"||!v)return null;
  let s=v.replace(/[₪\s]|ש"ח|ש״ח|ils|nis/gi,"");
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/-$/.test(s)){neg=!neg;s=s.slice(0,-1)}
  if(/^[-−–]/.test(s)){neg=!neg;s=s.slice(1)}
  s=s.replace(/^\+/,"").replace(/,(?=\d{3}(\D|$))/g,"");
  if(!/^\d+([.,]\d+)?$/.test(s))return null;
  const n=parseFloat(s.replace(",","."));
  return isFinite(n)?(neg?-n:n):null;
}
function headerMap(cells){
  const find=(...res)=>{for(const re of res){const i=cells.findIndex(c=>typeof c==="string"&&c.length<40&&re.test(c));if(i>-1)return i}return null};
  const date=find(/תאריך ה?עסקה|תאריך ה?רכישה|תאריך ה?פעולה/,/תאריך|date/i);
  if(date==null||parseDate(cells[date]))return null;
  let debit=find(/חובה|debit/i), credit=find(/זכות|credit/i);
  let amount=find(/סכום ה?חיוב|סכום לחיוב|חיוב בש/,/סכום|amount|^חיוב/i);
  if(amount===date)amount=null;
  if(debit!=null&&credit==null&&amount==null){amount=debit;debit=null}
  if(credit!=null&&debit==null){if(amount==null)amount=credit;credit=null}
  if(amount==null&&debit==null)return null;
  const desc=find(/שם בית|בית ה?עסק/,/תיאור|פרטים|פעולה|description|merchant|details|שם/i);
  return{date,amount,debit,credit,desc:desc===date?null:desc};
}
function pickDesc(cells,map){
  if(map.desc!=null&&typeof cells[map.desc]==="string"&&cells[map.desc])return cells[map.desc];
  let best="";
  cells.forEach((c,i)=>{if(i!==map.date&&typeof c==="string"&&c.length>best.length&&!parseDate(c)&&parseNum(c)==null)best=c});
  return best;
}
function guessMap(rows){
  const n=Math.max(0,...rows.map(r=>r.length)), st=[];
  for(let i=0;i<n;i++)st.push({d:0,n:0,dec:0,s:0});
  rows.forEach(r=>r.forEach((c,i)=>{if(c===""||c==null)return;if(parseDate(c)&&!(typeof c==="number"))st[i].d++;else if(parseNum(c)!=null){st[i].n++;if(!Number.isInteger(parseNum(c)))st[i].dec++}else if(typeof c==="string")st[i].s+=c.length}));
  let date=null,amount=null;
  st.forEach((x,i)=>{if(x.d&&(date==null||x.d>st[date].d))date=i});
  st.forEach((x,i)=>{if(i!==date&&x.n&&(amount==null||x.n+x.dec>st[amount].n+st[amount].dec))amount=i});
  if(date==null||amount==null||st[date].d<1)return null;
  return{date,amount,debit:null,credit:null,desc:null};
}
function extractRows(sheets){
  const out=[];
  sheets.forEach(raw=>{
    const rows=raw.map(r=>(Array.isArray(r)?r:[]).map(cleanCell));
    let map=null, signed=[], any=false;
    const take=(cells,m)=>{
      const date=parseDate(cells[m.date]);if(!date)return;
      const desc=pickDesc(cells,m);
      if(m.debit!=null){const d=parseNum(cells[m.debit]),c=m.credit!=null?parseNum(cells[m.credit]):null;
        if(d)out.push({date,amount:r2(Math.abs(d)),type:"exp",desc});else if(c)out.push({date,amount:r2(Math.abs(c)),type:"inc",desc})}
      else{const v=parseNum(cells[m.amount]);if(v)signed.push({date,v,desc})}
    };
    rows.forEach(cells=>{const hm=headerMap(cells);if(hm){map=hm;any=true;return}if(map)take(cells,map)});
    if(!any){const gm=guessMap(rows);if(gm)rows.forEach(c=>take(c,gm))}
    if(signed.length){
      const neg=signed.filter(x=>x.v<0).length, flip=neg>signed.length/2;
      signed.forEach(x=>{const v=flip?-x.v:x.v;
        if(v>0)out.push({date:x.date,amount:r2(v),type:"exp",desc:x.desc});
        else out.push({date:x.date,amount:r2(-v),type:"inc",desc:flip||/זיכוי|החזר/.test(x.desc)?x.desc:("זיכוי: "+x.desc).trim()})});
    }
  });
  return out;
}
function parseCSV(text){
  const head=text.split(/\r?\n/).slice(0,8).join("\n");
  const delim=["\t",";",",","|"].map(d=>[d,head.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"'&&cur==="")q=true;
    else if(ch===delim){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}
    else cur+=ch;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function decodeText(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder("utf-16le").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){try{return new TextDecoder("windows-1255").decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}
}
let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  if(!xlsxLoading)xlsxLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src=window.LOTUS_XLSX_SRC||"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res();s.onerror=()=>{xlsxLoading=null;rej(new Error("load"))};document.head.appendChild(s)});
  return xlsxLoading;
}
async function handleImportFile(file){
  formErr("קורא את הקובץ…",true);
  let sheets;
  try{
    const buf=await file.arrayBuffer();
    if(/\.(csv|txt|tsv)$/i.test(file.name))sheets=[parseCSV(decodeText(buf))];
    else{
      try{await loadXLSX()}catch(e){return formErr("לא הצלחנו לטעון את רכיב קריאת ה-Excel. אפשר לנסות שוב, או לשמור את הקובץ כ-CSV ולייבא אותו.")}
      const wb=window.XLSX.read(buf,{type:"array",cellDates:true});
      sheets=wb.SheetNames.map(n=>window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));
    }
  }catch(e){return formErr("לא הצלחנו לקרוא את הקובץ. כדאי לוודא שזה קובץ Excel או CSV תקין.")}
  let rows=extractRows(sheets);
  if(!rows.length)return formErr("לא מצאנו בקובץ שורות עם תאריך וסכום. כדאי לוודא שזה פירוט תנועות ולא סיכום.");
  if(rows.length>1500){rows=rows.slice(0,1500)}
  const mks=[...new Set(rows.map(r=>r.date.slice(0,7)))];
  if(mks.length>18)return formErr("הקובץ מכיל תנועות מיותר מ-18 חודשים. כדאי לייבא תקופה קצרה יותר.");
  for(const k of mks){if(!(await ensureMonth(k)))return formErr("לא הצלחנו לטעון את הנתונים השמורים של "+monthLabel(k)+". נסו שוב.")}
  const have={};mks.forEach(k=>S.months[k].tx.forEach(t=>have[t.date+"|"+t.amount+"|"+t.type+"|"+(t.desc||"").trim()]=1));
  const recNames=S.settings.incomes.concat(S.settings.fixed).map(x=>x.name.trim().toLowerCase()).filter(n=>n.length>2);
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  IMP=rows.map(r=>{
    const d=(r.desc||"").trim(), dl=d.toLowerCase();
    const dup=have[r.date+"|"+r.amount+"|"+r.type+"|"+d];
    const isRec=!dup&&recNames.some(n=>dl.includes(n)||(dl.length>2&&n.includes(dl)));
    return{date:r.date,amount:r.amount,type:r.type,desc:d,cat:r.type==="exp"?guessCat(d):"",on:!dup&&!isRec,tag:dup?"כבר קיימת":isRec?"נראית כמו קבועה":""};
  });
  sheetPreview();
}

  IMP=null;sheet.close();S.view="tx";S.q="";S.fcat="";render();

async function exportCsv(){

  try{await S.dl.save({filename:"lotus-"+S.mk+".csv",data:"﻿"+lines.join("\r\n")});toast("הקובץ נשמר")}

}

function lotusKeys(){let k=[];try{k=Object.keys(localStorage).filter(x=>x==="lotus:settings"||/^lotus:m-\d{4}-\d{2}$/.test(x))}catch(e){}return k}
async function backupNow(){
  if(!backend||!backend.all)return;
  let data;
  try{data=await backend.all()}catch(e){return toast("לא הצלחנו לקרוא את כל הנתונים. צריך חיבור לאינטרנט.")}
  try{await S.dl.save({filename:"lotus-backup-"+todayStr+".json",data:JSON.stringify({app:"lotus",v:1,saved:todayStr,data})});ls.set("lastBackup",todayStr);render();toast("הגיבוי ירד למכשיר")}
  catch(e){toast("לא הצלחנו ליצור קובץ גיבוי")}
}
let RESTORE=null;
function sheetRestore(){
  RESTORE=null;
  openSheet('<form data-form="restore" novalidate><h3>שחזור מגיבוי</h3><p class="hint">בוחרים קובץ גיבוי של Lotus. השחזור מחליף את כל הנתונים הקיימים '+(USER?"בחשבון שלך":"במכשיר הזה")+'.</p><label class="f">קובץ גיבוי<input class="field" id="restore-file" type="file" accept=".json,application/json"></label><p class="err" id="form-err" hidden></p><div class="acts"><button class="btn" type="submit" id="restore-go" disabled>להחליף את הנתונים ולשחזר</button><button class="btn ghost" type="button" data-act="close">ביטול</button></div></form>');
}
async function readRestore(file){
  RESTORE=null;$("#restore-go").disabled=true;
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.app!=="lotus"||!j.data||!j.data.settings||!Array.isArray(j.data.settings.cats))throw 0;
    const months=Object.keys(j.data).filter(k=>/^m-\d{4}-\d{2}$/.test(k)&&j.data[k]&&Array.isArray(j.data[k].tx));
    RESTORE={settings:j.data.settings,months:months.map(k=>[k,j.data[k]])};
    formErr("גיבוי מתאריך "+(j.saved?shortDate(String(j.saved)):"לא ידוע")+": "+months.length+" חודשים, "+nTx(sum(months,k=>j.data[k].tx.length))+".",true);
    $("#restore-go").disabled=false;
  }catch(e){formErr("זה לא קובץ גיבוי תקין של Lotus.")}
}
async function doRestore(){
  if(!RESTORE||!backend||!backend.replaceAll)return;
  const go=$("#restore-go");go.disabled=true;
  const data={settings:RESTORE.settings};RESTORE.months.forEach(m=>{data[m[0]]=m[1]});
  try{await backend.replaceAll(data)}
  catch(e){go.disabled=false;return formErr(backend.kind==="db"?"השחזור נכשל. צריך חיבור לאינטרנט.":"השחזור נכשל: אין מספיק מקום פנוי באחסון של הדפדפן.")}
  ls.del("cache");RESTORE=null;sheet.close();S.mk=curKey;S.view="home";S.offerMigrate=false;
  await loadAll();toast("הנתונים שוחזרו");
}

sheet.addEventListener("change",e=>{
  const t=e.target;
  if(t.name==="type")syncTxType();
  else if(t.id==="tx-cat")catTouched=true;
  else if(t.id==="imp-file"&&t.files&&t.files[0])handleImportFile(t.files[0]);
  else if(t.id==="restore-file"&&t.files&&t.files[0])readRestore(t.files[0]);
  else if(IMP&&t.dataset.i!=null){const r=IMP[+t.dataset.i];if(!r)return;if(t.type==="checkbox"){r.on=t.checked;t.closest(".imp-row").classList.toggle("off",!r.on);syncImpCount()}else r.cat=t.value}
});
sheet.addEventListener("input",e=>{
  if(e.target.id==="tx-desc"&&!catTouched){const g=guessCat(e.target.value,true),s=$("#tx-cat");if(g&&s)s.value=g}
});
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.close()});
sheet.addEventListener("close",()=>{IMP=null});
sheet.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target, fd=new FormData(f), kind=f.dataset.form;
  if(kind==="import-pick"||kind==="account")return;
  if(kind==="import")return commitImport();
  if(kind==="restore")return doRestore();
  if(kind==="del-account")return doDeleteAccount(f.querySelector("[type=submit]"));
  if(kind==="tx"){
    const amount=parseAmt(fd.get("amount")), date=String(fd.get("date")||"");
    if(!amount)return formErr("צריך להזין סכום גדול מאפס.");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!parseDate(date))return formErr("צריך לבחור תאריך.");
    const type=fd.get("type")==="inc"?"inc":"exp";
    const t={id:f.dataset.id||uid(),date,amount,desc:String(fd.get("desc")||"").trim(),type,cat:type==="exp"?String(fd.get("cat")||""):""};
    const mk=date.slice(0,7);
    const btn=f.querySelector("[type=submit]");btn.disabled=true;
    ensureMonth(mk).then(ok=>{
      if(!ok||!S.months[mk]){btn.disabled=false;return formErr("לא הצלחנו לטעון את "+monthLabel(mk)+". נסו שוב.")}
      let placed=false;
      for(const k in S.months){const a=S.months[k].tx,i=a.findIndex(x=>x.id===t.id);if(i>-1){if(k===mk){a[i]=t;placed=true}else{a.splice(i,1);save("m-"+k)}}}
      if(!placed)S.months[mk].tx.push(t);
      S.flashId=t.id;save("m-"+mk);sheet.close();render();S.flashId=null;
      const isNew=!f.dataset.id, first=isNew&&!S.demo&&sum(Object.keys(S.months),k=>S.months[k].tx.length)===1;
      if(isNew&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
      if(first){celebrate();toast("התנועה הראשונה נשמרה. ככה מתחילים.")}
      else if(mk!==S.mk)toast("נשמר בחודש "+monthLabel(mk));
      else if(isNew&&type==="exp"&&mk===curKey){const c=calc(curKey);if(c.budget>0&&c.left>=0){const d=todayLeft(c);toast(d.left>=0?"נשמר. נשאר להיום "+money(Math.floor(d.left)).replace(/<[^>]+>/g,""):"נשמר. היום עברת את הקצב היומי ב-"+money(Math.ceil(-d.left)).replace(/<[^>]+>/g,""))}}
    });
    return;
  }
  if(kind==="rec"){
    const name=String(fd.get("name")||"").trim(), amount=parseAmt(fd.get("amount")), day=Math.max(1,Math.min(31,parseInt(fd.get("day"),10)||1));
    if(!name)return formErr("צריך לתת שם.");
    if(!amount)return formErr("צריך להזין סכום גדול מאפס.");
    const arr=S.settings[f.dataset.kind], x={id:f.dataset.id||uid(),name,amount,day}, i=arr.findIndex(a=>a.id===x.id);
    if(i>-1)arr[i]=x;else arr.push(x);
  }
  if(kind==="cat"){
    const name=String(fd.get("name")||"").trim(), budget=parseAmt(fd.get("budget"))||0;
    if(!name)return formErr("צריך לתת שם לקטגוריה.");
    const c=S.settings.cats.find(a=>a.id===f.dataset.id);
    if(c){c.name=name;c.budget=budget}else S.settings.cats.push({id:uid(),name,budget,c:S.settings.cats.length%8+1});
  }
  if(kind==="saving")S.settings.saving=parseAmt(fd.get("amount"))||0;
  let after=null;
  const gs=S.settings.goals||(S.settings.goals=[]);
  const reached=g=>()=>{celebrate();toast("היעד הושג: "+g.name)};
  if(kind==="goal"){
    const name=String(fd.get("name")||"").trim(), target=parseAmt(fd.get("target")), saved=parseAmt(fd.get("saved"))||0;
    if(!name)return formErr("צריך לתת שם ליעד.");
    if(!target)return formErr("צריך להזין סכום יעד גדול מאפס.");
    let g=gs.find(x=>x.id===f.dataset.id);const was=!!g&&g.saved>=g.target;
    if(g){g.name=name;g.target=target;g.saved=saved}else{g={id:uid(),name,target,saved,c:[3,1,5,2,6,4,7,8][gs.length%8]};gs.push(g)}
    if(!was&&g.saved>=g.target)after=reached(g);
  }
  if(kind==="deposit"){
    const g=gs.find(x=>x.id===f.dataset.id), amt=parseAmt(fd.get("amount"));
    if(!g)return sheet.close();
    if(!amt)return formErr("צריך להזין סכום גדול מאפס.");
    const out=fd.get("dir")==="out", before=g.saved;
    if(out&&amt>g.saved)return formErr("אי אפשר למשוך יותר ממה שנחסך ביעד.");
    g.saved=r2(g.saved+(out?-amt:amt));
    if(before<g.target&&g.saved>=g.target)after=reached(g);
    else after=()=>toast(out?"המשיכה נרשמה":"ההפקדה נרשמה. נשארו "+money(Math.max(0,g.target-g.saved)).replace(/<[^>]+>/g,"")+" ליעד");
  }
  if(kind==="roll"){
    const g=gs.find(x=>x.id===fd.get("goal")), amt=parseAmt(fd.get("amount")), mk=f.dataset.mk, m=S.months[mk];
    if(!g||!m)return sheet.close();
    if(!amt)return formErr("צריך להזין סכום גדול מאפס.");
    const before=g.saved;g.saved=r2(g.saved+amt);m.rolled=amt;save("m-"+mk);
    after=before<g.target&&g.saved>=g.target?reached(g):()=>{celebrate();toast("היתרה נוספה ליעד "+g.name)};
  }
  saveSettings();sheet.close();render();
  if(after)after();
});
function saveSettings(){save("settings");if(!S.demo&&stampRec())save("m-"+curKey)}

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null;
function toast(msg,undo){
  undoFn=undo||null;
  const el=$("#toast");el.innerHTML='<div role="status"><span>'+esc(msg)+"</span>"+(undo?'<button data-act="undo">ביטול</button>':"")+"</div>";el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;undoFn=null},undo?7000:3200);
}

/* ---------- actions ---------- */
function findTx(id){for(const k in S.months){const t=S.months[k].tx.find(x=>x.id===id);if(t)return{t,k}}return null}
function canEdit(){
  if(S.checking){toast("רגע, טוען את הנתונים השמורים…");return false}
  if(S.loadFailed){toast("אין חיבור לנתונים השמורים. אפשר לנסות שוב בראש הדף.");return false}
  return true;
}
const EDITING={add:1,"edit-tx":1,"add-income":1,"add-fixed":1,"edit-rec":1,"add-cat":1,"edit-cat":1,"edit-saving":1,start:1,"import":1,"add-goal":1,"edit-goal":1,deposit:1,roll:1,"make-fixed":1};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-view]");if(!b)return;
  if(b.dataset.view){if(sheet.open)sheet.close();S.view=b.dataset.view;render();window.scrollTo(0,0);return}
  const a=b.dataset.act,id=b.dataset.id;
  if(EDITING[a]&&!canEdit())return;
  if(a==="prev"||a==="next"){S.mk=shiftMonth(S.mk,a==="prev"?-1:1);render();ensureMonth(S.mk)}
  else if(a==="add")sheetTx(null);
  else if(a==="edit-tx"){const r=findTx(id);if(r)sheetTx(r.t)}
  else if(a==="del-tx"){const r=findTx(id);if(!r)return;const arr=S.months[r.k].tx,i=arr.indexOf(r.t);arr.splice(i,1);save("m-"+r.k);sheet.close();render();toast("התנועה נמחקה",()=>{const cur=S.months[r.k];if(!cur)return;cur.tx.splice(Math.min(i,cur.tx.length),0,r.t);save("m-"+r.k);render()})}
  else if(a==="add-income")sheetRec("incomes",null);
  else if(a==="add-fixed")sheetRec("fixed",null);
  else if(a==="edit-rec"){const x=S.settings[b.dataset.kind].find(q=>q.id===id);if(x)sheetRec(b.dataset.kind,x)}
  else if(a==="del-rec"){const kind=b.dataset.kind,arr=S.settings[kind],i=arr.findIndex(q=>q.id===id);if(i<0)return;const x=arr.splice(i,1)[0];saveSettings();sheet.close();render();toast("נמחק: "+x.name,()=>{const cur=S.settings[kind];cur.splice(Math.min(i,cur.length),0,x);saveSettings();render()})}
  else if(a==="add-cat")sheetCat(null);
  else if(a==="edit-cat"){const c=S.settings.cats.find(q=>q.id===id);if(c)sheetCat(c)}
  else if(a==="del-cat"){const arr=S.settings.cats,i=arr.findIndex(q=>q.id===id);if(i<0)return;const c=arr.splice(i,1)[0];if(S.fcat===c.id)S.fcat="";saveSettings();sheet.close();render();toast("הקטגוריה נמחקה. התנועות שלה נשארו ללא קטגוריה.",()=>{const cur=S.settings.cats;cur.splice(Math.min(i,cur.length),0,c);saveSettings();render()})}
  else if(a==="edit-saving")sheetSaving();
  else if(a==="more")sheetMore();
  else if(a==="open-cat"){S.fcat=id||"";S.q="";S.view="tx";render();window.scrollTo(0,0)}
  else if(a==="add-goal")sheetGoal(null);
  else if(a==="edit-goal"){const g=(S.settings.goals||[]).find(q=>q.id===id);if(g)sheetGoal(g)}
  else if(a==="deposit"){const g=(S.settings.goals||[]).find(q=>q.id===id);if(g)sheetDeposit(g)}
  else if(a==="del-goal"){const arr=S.settings.goals||[],i=arr.findIndex(q=>q.id===id);if(i<0)return;const g=arr.splice(i,1)[0];saveSettings();sheet.close();render();toast("היעד נמחק: "+g.name,()=>{const cur=S.settings.goals||(S.settings.goals=[]);cur.splice(Math.min(i,cur.length),0,g);saveSettings();render()})}
  else if(a==="roll")sheetRoll();
  else if(a==="hide-setup"){ls.set("hideSetup",1);render()}
  else if(a==="quick"){const d=b.dataset.desc||"",i=$("#tx-desc"),s=$("#tx-cat"),g=guessCat(d,true);if(i)i.value=d;if(g&&s)s.value=g;const am=$("#tx-amount");if(am)am.focus()}
  else if(a==="skip-rec"){const r=findTx(id);if(r){const l=ls.get("skipRec")||[];l.push(lower(r.t.desc));ls.set("skipRec",l.slice(-200))}render()}
  else if(a==="make-fixed"){
    const r=findTx(id);if(!r)return;
    const arr=S.months[r.k].tx,i=arr.indexOf(r.t),fx={id:uid(),name:r.t.desc,amount:r.t.amount,day:+r.t.date.slice(8)};
    arr.splice(i,1);S.settings.fixed.push(fx);saveSettings();save("m-"+r.k);render();
    toast("נוסף להוצאות הקבועות והוסר מתנועות החודש",()=>{const j=S.settings.fixed.findIndex(q=>q.id===fx.id);if(j>-1)S.settings.fixed.splice(j,1);const cur=S.months[r.k];if(cur)cur.tx.splice(Math.min(i,cur.tx.length),0,r.t);saveSettings();save("m-"+r.k);render()});
  }
  else if(a==="fcat"){S.fcat=id||"";render()}
  else if(a==="import"){if(S.demo)return toast("כדי לייבא, קודם לוחצים על ״להתחיל עם הנתונים שלי״");sheetImport()}
  else if(a==="export")exportCsv();
  else if(a==="signin")signIn();
  else if(a==="account")sheetAccount();
  else if(a==="signout"){if(AUTH)AUTH.signOut().catch(()=>toast("ההתנתקות נכשלה. נסו שוב."))}
  else if(a==="migrate")migrateLocal();
  else if(a==="no-migrate"){ls.set("noMigrate",1);S.offerMigrate=false;render()}
  else if(a==="del-account")sheetDelAccount();
  else if(a==="retry-month")ensureMonth(S.mk);
  else if(a==="backup")backupNow();
  else if(a==="restore"){if(S.checking)return;sheetRestore()}
  else if(a==="imp-all"||a==="imp-none"){if(!IMP)return;const on=a==="imp-all";IMP.forEach(r=>r.on=on);sheet.querySelectorAll(".imp-row").forEach(row=>{row.classList.toggle("off",!on);row.querySelector("input[type=checkbox]").checked=on});syncImpCount()}
  else if(a==="close")sheet.close();
  else if(a==="undo"){if(undoFn)undoFn();undoFn=null;$("#toast").hidden=true}
  else if(a==="retry")loadAll();
  else if(a==="resave"){S.saveFailed=false;save("settings");Object.keys(S.months).forEach(k=>save("m-"+k));render()}
  else if(a==="start"){S.demo=false;S.settings=emptySettings();S.months={[curKey]:{tx:[]}};S.mk=curKey;S.view="home";stampRec();save("settings");save("m-"+curKey);render();sheetRec("incomes",null)}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="n"&&e.key!=="N"&&e.key!=="מ")return;
